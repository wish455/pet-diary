# Render 蓝图：把本仓库推送到 GitHub 后，在 Render 里选 "New + → Blueprint" 指向仓库即可。
# 免费套餐 (plan: free) 没有持久磁盘，容器重启后数据会丢失；
# 正式用请把 plan 改成 starter 或更高，磁盘会一直保留。
services:
  - type: web
    name: pet-diary
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 想先试可用 free，但不带磁盘、会丢数据
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"       # Render 自带 HTTPS
      - key: OPEN_REGISTRATION
        value: "1"          # 改为 0 可关闭注册
      - key: INVITE_CODE
        sync: false         # 需要邀请码时在这里填
      - key: ADMIN_USERS
        value: demo         # 这个账号会被自动提升为管理员（与下面的种子数据一致）
      - key: SESSION_DAYS
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "8"
    disk:
      name: pet-diary-data
      mountPath: /data      # 数据库与上传图片的持久化目录
      sizeGB: 1
